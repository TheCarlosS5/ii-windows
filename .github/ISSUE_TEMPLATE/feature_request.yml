name: Proponer una idea / Suggest an idea
description: Algo de illogical impulse que falta en Windows, o una mejora. / Something from illogical impulse missing on Windows, or an improvement.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría? / What would you like?
      description: Si es algo que ii hace en Linux (Hyprland), cuéntalo y, si puedes, pon una captura. / If ii does it on Linux (Hyprland), say so and add a screenshot if you can.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: ¿Para qué lo usarías? / What would you use it for?
